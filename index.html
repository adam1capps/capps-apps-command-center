<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Capps Apps Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds/tokens.css"/>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #FFFFFF;
    color: #0F172A;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body { min-height: 100vh; }
  button, input, select, textarea { font-family: inherit; }
  a { color: inherit; }

  /* shared animations */
  @keyframes ccFade {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes ccSlideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes ccSlideIn {
    from { transform: translateX(40px); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }
  @keyframes ccPulse {
    0%   { box-shadow: 0 0 0 0 rgba(214,69,69,0.45); }
    70%  { box-shadow: 0 0 0 6px rgba(214,69,69,0); }
    100% { box-shadow: 0 0 0 0 rgba(214,69,69,0); }
  }
  @keyframes ccConnPulse {
    0%   { box-shadow: 0 0 0 0 rgba(0,189,112,0.55); }
    70%  { box-shadow: 0 0 0 7px rgba(0,189,112,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,189,112,0); }
  }

  /* slim scrollbar on pipeline */
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* selection */
  ::selection { background: #1E2C5520; color: #0F172A; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script src="notes-store.js"></script>
